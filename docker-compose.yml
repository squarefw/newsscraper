version: '3.8'

services:
  # 统一新闻处理服务（合并discovery和app）
  newsscraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newsscraper-unified
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=Europe/Dublin
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./examples:/app/examples
      - ./logs:/app/logs
      - newsscraper_data:/app/data
    networks:
      - newsscraper-network
    # 使用定时触发统一服务脚本
    command: ["node", "src/services/unified-service-cron.js", "config/config.remote-aliyun.json"]


volumes:
  newsscraper_data:

networks:
  newsscraper-network:
    driver: bridge
